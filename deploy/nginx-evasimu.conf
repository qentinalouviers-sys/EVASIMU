# nginx — SaaS EVASIMU
#
# DOMAINE_A_REMPLACER est substitué par deploy/installer.sh.
# certbot ajoute ensuite le bloc TLS et la redirection http → https.
#
# ⚠ Deux pièges à connaître avant de « durcir » cette configuration :
#
#  1. NE PAS ajouter « X-Frame-Options: SAMEORIGIN ». La quasi-totalité des
#     guides de sécurité le recommandent, mais ici le produit EST une iframe
#     posée sur le site de vos clients : cet en-tête la bloquerait partout.
#     Le contrôle d'intégration se fait par « Content-Security-Policy:
#     frame-ancestors », que l'application pose elle-même, client par client,
#     selon les domaines qu'il a déclarés.
#
#  2. NE PAS ajouter de « Content-Security-Policy » global pour la même raison :
#     il écraserait celui de l'application.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE_A_REMPLACER;

    # Les widgets sont chargés depuis des sites tiers : ces réponses doivent
    # rester lisibles par n'importe quelle origine (l'application pose déjà
    # les en-têtes CORS qui conviennent).
    client_max_body_size 32m;

    # L'application compresse déjà elle-même (gzip et brotli) : nginx ne doit
    # pas recompresser une réponse qui porte un Content-Encoding.
    gzip on;
    gzip_types text/plain text/css application/json text/javascript application/xml image/svg+xml;
    gzip_min_length 1400;
    gzip_proxied any;
    gzip_vary on;

    # En-têtes de sécurité compatibles avec un produit embarquable
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Proxy PVGIS — service séparé, sur son propre port
    location /api/pvgis {
        proxy_pass http://127.0.0.1:PORT_PVGIS_A_REMPLACER/api/pvgis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # le quota par IP en dépend
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:PORT_SAAS_A_REMPLACER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # La page d'un widget fait ~1 Mo avant compression : les tampons par
        # défaut la feraient transiter par un fichier temporaire à chaque appel.
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
    }

    access_log /var/log/nginx/evasimu.access.log;
    error_log  /var/log/nginx/evasimu.error.log;
}
