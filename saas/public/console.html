<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Simulateur photovoltaïque</title>
<style>
:root{--nav:#0f2a43;--nav2:#16324f;--acc:#f59e0b;--ink:#16202b;--ink2:#51606f;--ink3:#8a97a5;
--line:#e3e8ee;--bg:#f2f5f8;--ok:#15803d;--ko:#b91c1c;--r:11px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
a{color:var(--nav)}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;
padding:8px 13px;color:var(--ink)}
button:hover{border-color:var(--ink3)}
button.p{background:var(--acc);border-color:#d97706;color:#fff;font-weight:700}
button.p:hover{background:#d97706}
button.d{background:#fff;border-color:#fca5a5;color:var(--ko)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);
border-radius:9px;background:#fff;color:var(--ink)}
input[type=color]{padding:2px;height:38px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:11px 0 4px}
header{background:var(--nav);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:14px;
position:sticky;top:0;z-index:20}
header b{font-size:15px}
header nav{display:flex;gap:4px;margin-left:14px;flex-wrap:wrap}
header nav button{background:transparent;border:0;color:#c7d4e2;padding:7px 11px;border-radius:8px}
header nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
header .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:#c7d4e2}
main{max-width:1240px;margin:0 auto;padding:18px 14px 60px}
.carte{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.carte h2{font-size:16px;margin:0 0 10px;color:var(--nav)}
.carte h3{font-size:14px;margin:16px 0 6px;color:var(--nav)}
.grille{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:25px;color:var(--nav);line-height:1.15}
.kpi span{font-size:12.5px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;
padding:8px 9px;border-bottom:2px solid var(--line)}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafcfe}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.actif{background:#dcfce7;color:var(--ok)}
.pill.essai{background:#fef3c7;color:#92400e}
.pill.suspendu{background:#e5e7eb;color:#374151}
.pill.expire{background:#fee2e2;color:var(--ko)}
.muted{color:var(--ink2);font-size:13px}
.mini{color:var(--ink3);font-size:12px}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
pre{background:#0f2a43;color:#e6edf3;padding:12px;border-radius:9px;overflow:auto;margin:6px 0}
.ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
dialog{border:0;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 28px);
box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,42,67,.45)}
dialog .in{padding:20px}
dialog.large{max-width:760px}

/* --- Import guidé --- */
.depot{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;
  color:var(--ink2);margin-bottom:10px;transition:border-color .15s,background .15s}
.depot.survol{border-color:var(--accent);background:rgba(245,158,11,.07)}

/* ---------- liste de prospects ---------- */
.tprospects td{vertical-align:top}
.tprospects .sous{display:block;font-size:11.5px;color:var(--ink3);max-width:280px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puces{display:flex;gap:5px;align-items:center}
/* `flex:0 0 auto` et `box-sizing` explicites : la pastille vit dans un
   conteneur flex, et une taille fixe seule ne suffit pas à l'empêcher de
   s'étirer. Le nom de classe évite « vide », déjà pris par les états vides. */
.puce{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  flex:0 0 auto;width:26px;height:26px;padding:0;
  border-radius:8px;font-size:13px;text-decoration:none;border:1px solid transparent}
.puce.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.puce.ok:hover{background:#bbf7d0}
.puce.absent{background:#f3f4f6;color:#c3c9d2}
.score{display:inline-block;min-width:30px;text-align:center;font-weight:700;font-size:12.5px;
  padding:3px 7px;border-radius:8px;background:#eef2f7;color:var(--nav)}
.score.gros{font-size:16px;padding:6px 12px}

/* ---------- fiche prospect ---------- */
.fiche .entete{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  flex-wrap:wrap;margin-bottom:12px}
.fiche .entete h2{margin:0 0 2px}
.fiche .bloc{background:var(--bg);border-color:var(--line);margin-bottom:12px}
.fiche .bloc h3{margin-top:0}
.contacts{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.contact{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#fff;
  border:1px solid var(--line);border-radius:9px;flex-wrap:wrap}
.contact .ic{width:18px;text-align:center;color:var(--ink2)}
.contact .val{font-weight:600;text-decoration:none;word-break:break-all}
.contact .sp{flex:1}
.mini-btn{padding:2px 8px;font-size:12px;line-height:1.6;border-radius:7px}
.mini-btn.d{border-color:#fca5a5;color:var(--ko)}
.ajout{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ajout input{flex:1;min-width:150px}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.champ{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.champ .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3)}
.champ .v,.champ a{font-size:13.5px;word-break:break-word}
.notes{margin-top:9px;white-space:pre-wrap}
.journal{max-height:230px;overflow:auto;margin-bottom:9px}
.journal p{margin:0 0 5px;line-height:1.5}
.journal .q{color:var(--ink3);margin-right:6px}
.barre-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  position:sticky;bottom:0;background:#fff;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
.barre-actions .sp{flex:1}

/* ---------- mobile ----------
   Le tableau devient une pile de cartes : sur un téléphone, sept colonnes
   obligent à faire défiler horizontalement, ce qui rend la liste inutilisable.
   Chaque cellule porte son intitulé en `data-l`, il n'y a donc qu'un seul
   rendu à maintenir. */
@media (max-width:860px){
  body{font-size:15px}
  header{padding:9px 12px;gap:8px;flex-wrap:wrap}
  header nav{margin-left:0;width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  header nav button{white-space:nowrap}
  header .sp{margin-left:auto}
  main{padding:12px 10px 70px}
  .carte{padding:13px}
  dialog{max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0}
  dialog .in{padding:16px}

  .tprospects thead{display:none}
  .tprospects,.tprospects tbody,.tprospects tr,.tprospects td{display:block;width:100%}
  .tprospects tr{background:#fff;border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;margin-bottom:9px}
  .tprospects tr:hover td{background:transparent}
  .tprospects td{border:0;padding:3px 0;display:flex;gap:10px;align-items:center}
  .tprospects td::before{content:attr(data-l);flex:0 0 84px;font-size:11px;text-transform:uppercase;
    letter-spacing:.03em;color:var(--ink3);line-height:1.3}
  .tprospects td[data-l="Entreprise"]{display:block;padding-bottom:7px}
  .tprospects td[data-l="Entreprise"]::before{display:none}
  .tprospects td[data-l="Entreprise"] b{font-size:15.5px}
  .tprospects td[data-l=""]{padding-top:9px}
  .tprospects td[data-l=""]::before{display:none}
  .tprospects td[data-l=""] button{width:100%}
  .tprospects .sous{max-width:100%}

  .champs{grid-template-columns:1fr}
  /* Empilées et pleine largeur : à trois boutons côte à côte sur 390 px,
     « Créer son widget d'essai » se cassait sur quatre lignes. L'ordre est
     inversé pour que l'action principale tombe sous le pouce. */
  .barre-actions{position:sticky;bottom:0;padding:11px 0;background:#fff;
    flex-direction:column-reverse;align-items:stretch}
  .barre-actions button{width:100%}
  .barre-actions .sp{display:none}
  table:not(.tprospects){display:block;overflow-x:auto;white-space:nowrap}
}
.depot .lien{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;
  cursor:pointer;font:inherit;width:auto}
.apercu{margin-top:12px}
.apercu .resume{margin:0 0 8px;padding:8px 11px;border-radius:8px;font-size:14px}
.apercu .resume.ok{background:#eaf7ee;color:#14532d}
.apercu .resume.attention{background:#fff5e0;color:#6b4c11}
.apercu .resume.ko{background:#fdeaea;color:#b42318}
table.tapercu{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
table.tapercu th{text-align:left;color:var(--ink2);font-weight:600;padding:5px 7px;
  border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.tapercu td{padding:5px 7px;border-bottom:1px solid var(--line);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
table.tapercu tr.ko td{color:#b42318;background:#fffafa}
table.tapercu td.diag{width:34%;color:var(--ink2);font-size:12.5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;
padding:11px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.vide{text-align:center;color:var(--ink2);padding:26px}
.etape{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:120px}
.etape b{display:block;font-size:20px;color:var(--nav)}
.etape span{font-size:12px;color:var(--ink2)}
#connexion{max-width:380px;margin:9vh auto}
</style>
</head>
<body>
<div id="app"></div>
<script src="/public/console.js"></script>
</body>
</html>
