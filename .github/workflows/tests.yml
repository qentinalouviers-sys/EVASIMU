# Suite de tests complète. Aucune dépendance à installer, aucun appel réseau :
# le proxy PVGIS, l'API du SaaS et l'inspection de sites utilisent tous des
# doublures, les tests passent donc hors ligne comme en CI.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Node 22.5 minimum : le SaaS utilise `node:sqlite`, intégré à partir de
      # cette version. Sous Node 20, tout ce qui touche à la base échouait sur
      # ERR_UNKNOWN_BUILTIN_MODULE — la CI ne validait donc ni le SaaS, ni le
      # CRM, ni les agents, tout en affichant un échec qu'on finissait par ne
      # plus lire.
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version utilisée
        run: node -v

      # Une seule commande, qui suit package.json : une suite ajoutée est
      # couverte sans qu'il faille penser à modifier ce fichier. C'est déjà ce
      # que fait le script de mise à jour du serveur.
      - name: Suite complète
        run: npm test

      - name: Vérification syntaxique du widget
        run: |
          node --check src/evasimu-sim.js
          node --check src/evasimu-3d.js
          node --check build-demo.js
          node --check saas/public/console.js
          node -e "JSON.parse(require('fs').readFileSync('config/offers.json','utf8'))" && echo "offers.json valide"

      - name: La démo autonome se reconstruit
        run: node build-demo.js
