# Publie le simulateur RDF-SOLAR sur GitHub Pages à chaque push.
# L'étape configure-pages active Pages automatiquement (source : GitHub Actions).
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/solar-panel-simulator-tool-2ka0yk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Configuration de Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetage du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
