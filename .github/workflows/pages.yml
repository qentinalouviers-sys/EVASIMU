# Publie le simulateur RDF-SOLAR sur GitHub Pages.
# Le site est servi depuis la branche gh-pages (activation automatique par GitHub) ;
# ce workflow la synchronise avec la branche principale à chaque push.
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/solar-panel-simulator-tool-2ka0yk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Synchronisation vers gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
