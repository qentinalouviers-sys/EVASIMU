# Publie le simulateur EVASIMU sur GitHub Pages.
# Le site est servi depuis la branche gh-pages (activation automatique par GitHub) ;
# ce workflow la synchronise avec la branche principale à chaque push.
#
# Clé Google Solar (démonstration) : si le secret GOOGLE_SOLAR_API_KEY est défini
# dans Settings → Secrets and variables → Actions, il est injecté dans
# config/local.js au moment du déploiement — la clé ne vit jamais dans le code
# source. ⚠ Une clé servie à un navigateur est lisible par les visiteurs :
# elle DOIT être restreinte dans Google Cloud (referrers HTTP limités au domaine
# du site + restriction à la seule Solar API) avant d'être mise en ligne.
name: Déploiement GitHub Pages

# UNE SEULE branche de production. Trois branches poussaient auparavant en force
# sur gh-pages : la dernière gagnait, et un déploiement écrasait le précédent.
on:
  push:
    branches:
      - claude/saas-leads-clarification-ds3fv8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Identité git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Injection de la configuration locale (clé Google, proxy PVGIS)
        env:
          GOOGLE_SOLAR_API_KEY: ${{ secrets.GOOGLE_SOLAR_API_KEY }}
          PVGIS_PROXY_URL: ${{ vars.PVGIS_PROXY_URL }}
        run: |
          if [ -n "$GOOGLE_SOLAR_API_KEY" ] || [ -n "$PVGIS_PROXY_URL" ]; then
            printf 'window.EVASIMU_LOCAL = { googleSolarApiKey: "%s", pvgisProxyUrl: "%s" };\n' \
              "$GOOGLE_SOLAR_API_KEY" "$PVGIS_PROXY_URL" > config/local.js
            git add -f config/local.js
            git commit -m "Injection de la configuration de démonstration depuis la CI"
            [ -n "$GOOGLE_SOLAR_API_KEY" ] && echo "Clé Google Solar injectée." || echo "Pas de clé Google Solar."
            [ -n "$PVGIS_PROXY_URL" ] && echo "Proxy PVGIS : $PVGIS_PROXY_URL" || echo "Pas de proxy PVGIS : moteur embarqué."
          else
            echo "Ni clé Google Solar ni proxy PVGIS : site déployé avec le moteur embarqué seul."
          fi

      - name: Synchronisation vers gh-pages
        run: git push origin HEAD:gh-pages --force
